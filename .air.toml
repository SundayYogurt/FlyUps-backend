#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]

 bin = "./tmp/main"
 cmd = "go build -o ./tmp/main main.go"
 entrypoint = ["./tmp/main"]
 delay = 1000
 exclude_dir = ["assets", "tmp", "vendor", "testdata"]
 include_ext = ["go", "tpl", "tmpl", "html", "env"] # เพิ่ม env เข้าไปด้วย

 poll = true
 poll_interval = 500

  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
