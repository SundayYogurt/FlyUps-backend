services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_PORT: "3000"
      DSN: "host=db user=root password=root dbname=flyup port=5432 sslmode=disable"
      APP_SECRET: "supersecret"
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: "FlyUp <noreply@api.flyupapi.dev>"
      BASE_URL: "http://localhost:5173"

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: flyup
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d flyup" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: