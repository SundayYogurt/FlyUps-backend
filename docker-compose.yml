services:
  app:
    image: sundayyogurt/flyup:latest
    restart: always
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /etc/flyup/.env:/app/.env:ro
    networks:
      - flyup-net

  redis:
    image: redis:7
    container_name: flyup-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flyup-net

  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=n8n.fly-up.app
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.fly-up.app/
      - GENERIC_TIMEZONE=Asia/Bangkok
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
    expose:
      - "5678"
    networks:
      - flyup-net

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    restart: always
    user: root
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    networks:
      - flyup-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - n8n
    networks:
      - flyup-net

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  grafana:
    image: grafana/grafana:latest
    container_name: flyup-grafana
    restart: always
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - flyup-net

  prometheus:
    image: prom/prometheus:latest
    container_name: flyup-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - flyup-net

networks:
  flyup-net:

volumes:
  redis-data:
  n8n-data:
  jenkins-data:
  grafana-data:
  prometheus-data: