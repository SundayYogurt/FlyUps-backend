          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get Project Milestones
      tags:
      - Projects
    post:
      consumes:
      - application/json
      description: Pioneer adds a new milestone to their project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Milestone Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMilestoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Milestone created
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Add Milestone to Project
      tags:
      - Projects
  /pioneer/projects/{id}/stories:
    get:
      consumes:
      - application/json
      description: Pioneer gets all story sections of a project
      parameters:
