basePath: /api/v1
definitions:
  domain.MediaType:
    enum:
    - image
    - video
    - raw
    type: string
    x-enum-varnames:
    - MediaTypeImage
    - MediaTypeVideo
    - MediaTypeRaw
  domain.Meeting:
