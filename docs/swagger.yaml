      produces:
      - application/json
      responses:
        "200":
          description: id card approved
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Approve ID card
      tags:
      - Admin
  /admin/approve-student-card/{id}:
