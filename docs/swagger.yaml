      due_date:
        type: string
      duration:
        type: integer
      id:
        type: integer
      meetings:
        items:
          $ref: '#/definitions/domain.Meeting'
        type: array
      original_due_date:
        type: string
      percent_release:
        type: integer
      phase_no:
        type: integer
      project_id:
        type: integer
      retry_count:
        type: integer
      retry_deadline:
        type: string
      sort_order:
        type: integer
      status:
        $ref: '#/definitions/domain.MilestoneStatus'
      submission_attachments:
        items:
          type: string
        type: array
      submission_criteria:
        items:
          type: string
        type: array
      submission_links:
        items:
          type: string
        type: array
      submission_summary:
