  /pioneer/projects/{id}:
    delete:
      consumes:
      - application/json
      description: Pioneer deletes their whole project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project deleted
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete Project
      tags:
      - Projects
    get:
      consumes:
      - application/json
      description: Pioneer gets details of their specific project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project details
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get My Project by ID
      tags:
      - Projects
    patch:
      consumes:
      - application/json
      description: Pioneer updates their existing project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Project Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Project updated
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update Project
      tags:
      - Projects
  /pioneer/projects/{id}/close:
    patch:
      consumes:
      - application/json
      description: Pioneer or Admin closes a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project closed
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Close Project
      tags:
      - Projects
  /pioneer/projects/{id}/faqs:
    post:
      consumes:
      - application/json
      description: Pioneer creates a new FAQ for their project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: FAQ Data
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
