        "200":
          description: FAQ created
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create Project FAQ
      tags:
      - Projects
  /pioneer/projects/{id}/media:
    get:
      consumes:
      - application/json
      description: Pioneer gets their project media items
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of project media
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get Project Media
      tags:
      - Projects
    post:
      consumes:
      - application/json
      description: Pioneer uploads media (image/video) URL to project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
