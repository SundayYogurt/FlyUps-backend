basePath: /
definitions:
  domain.MediaType:
    enum:
    - image
    - video
    - raw
    type: string
    x-enum-varnames:
    - MediaTypeImage
    - MediaTypeVideo
    - MediaTypeRaw
  domain.MilestoneStatus:
    enum:
    - draft
    - waiting
    - active
    - submitted
    - approved
    - rejected
    - paid
    type: string
    x-enum-varnames:
    - MilestoneDraft
    - MilestoneWaiting
    - MilestoneActive
    - MilestoneSubmitted
    - MilestoneApproved
    - MilestoneRejected
    - MilestonePaid
  domain.ProjectVisibility:
    enum:
    - private
    - public
    - unlisted
    type: string
    x-enum-varnames:
    - VisibilityPrivate
    - VisibilityPublic
    - VisibilityUnlisted
  dto.CreateInvestmentRequest:
    properties:
      amount:
        type: number
      project_id:
        type: integer
    required:
    - amount
    - project_id
    type: object
  dto.CreateMilestoneRequest:
    properties:
      acceptance_criteria:
        type: string
      description:
        type: string
      end_date:
        type: string
      phase_no:
        type: integer
      sortOrder:
        type: integer
      start_date:
        type: string
      status:
        $ref: '#/definitions/domain.MilestoneStatus'
      title:
        type: string
      type:
        $ref: '#/definitions/domain.MediaType'
      url:
        type: string
    type: object
  dto.CreateProjectUpdateRequest:
    properties:
      content:
        type: string
      milestone_id:
        type: integer
      title:
        type: string
      visibility:
        $ref: '#/definitions/domain.ProjectVisibility'
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.InvestmentResponse:
    properties:
      expires_at:
        type: string
      investment_id:
        type: integer
      qr_code_image_url:
        type: string
      reference_number:
        type: string
      title:
        type: string
      total_amount:
        type: number
    type: object
  dto.UpdateMilestoneRequest:
    properties:
      acceptance_criteria:
        type: string
      description:
        type: string
      end_date:
        type: string
      phase_no:
        type: integer
      sortOrder:
        type: integer
      start_date:
        type: string
      status:
        $ref: '#/definitions/domain.MilestoneStatus'
      title:
        type: string
      type:
        $ref: '#/definitions/domain.MediaType'
      url:
        type: string
    type: object
  dto.UpdateProjectRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      duration_days:
        type: integer
      duration_months:
        type: integer
      funding_goal:
        type: number
      max_invest_amount:
        type: number
      min_invest_amount:
        type: number
      platform_fee:
        type: number
      profit_share_pct:
        type: number
      risk:
        type: string
      softcap:
        type: number
      title:
        type: string
      visibility:
        type: string
    type: object
  dto.UpdateProjectUpdateRequest:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  dto.UserSignin:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.UserSignup:
    properties:
      accept_terms:
        description: ยอมรับข้อตกลง
        type: boolean
      email:
        type: string
      first_name:
        description: ข้อมูลส่วนตัว
        type: string
      last_name:
        type: string
      password:
        description: รหัสผ่าน
        minLength: 8
        type: string
      phone:
        description: เบอร์โทรศัพท์ (ใน UI ไม่มีดอกจัน * แต่ใน DBML ระบุว่า not null
          ดังนั้นควรบังคับกรอก)
        type: string
      role:
        enum:
        - pioneer
        - booster
        type: string
    required:
    - accept_terms
    - email
    - first_name
    - last_name
    - password
    - phone
    - role
    type: object
host: localhost:3000
info:
  contact: {}
  description: FlyUps crowdfunding platform API
  title: FlyUps API
  version: "1.0"
paths:
  /admin/categories:
    post:
      consumes:
      - application/json
      description: Admin creates a new project category
      parameters:
      - description: Category Name
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Category created
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create Category
      tags:
      - Categories
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      description: Admin deletes a project category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Category deleted
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete Category
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Admin updates an existing project category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: New Category Name
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Category updated
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update Category
      tags:
      - Categories
  /admin/projects/{id}/approve:
    patch:
      consumes:
      - application/json
      description: Admin approves a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project approved
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Approve Project
      tags:
      - Projects
  /admin/projects/{id}/reject:
    patch:
      consumes:
      - application/json
      description: Admin rejects a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project rejected
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Reject Project
      tags:
      - Projects
  /admin/projects/{id}/status:
    patch:
      consumes:
      - application/json
      description: Admin updates the status of a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status Update Data
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Status updated
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update Project Status
      tags:
      - Projects
  /categories:
    get:
      consumes:
      - application/json
      description: Get list of all project categories
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            type: object
      summary: Get All Categories
      tags:
      - Categories
  /categories/{id}:
    get:
      consumes:
      - application/json
      description: Get specific category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Category details
          schema:
            type: object
      summary: Get Category by ID
      tags:
      - Categories
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset link to user email
      parameters:
      - description: Forgot Password Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset link sent message
          schema:
            type: object
        "400":
          description: Invalid email or user not found
          schema:
            type: object
      summary: Forgot Password
      tags:
      - Users
  /investments:
    get:
      description: Get all investments made by the current booster user
      produces:
      - application/json
      responses:
        "200":
          description: list of investments
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my investments
      tags:
      - Investments
    post:
      consumes:
      - application/json
      description: Create a new investment for a project and get a PromptPay QR code
      parameters:
      - description: Investment request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateInvestmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: investment created with QR code
          schema:
            $ref: '#/definitions/dto.InvestmentResponse'
        "400":
          description: invalid request or business rule violation
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an investment
      tags:
      - Investments
  /investments/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific investment and its transaction by investment ID
        (booster only)
      parameters:
      - description: Investment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: investment and transaction detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid investment id
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: investment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get investment detail
      tags:
      - Investments
  /pioneer/projects:
    get:
      consumes:
      - application/json
      description: Pioneer gets list of their own projects
      produces:
      - application/json
      responses:
        "200":
          description: List of projects
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List My Projects
      tags:
      - Projects
    post:
      consumes:
      - application/json
      description: Pioneer creates a new project outline
      produces:
      - application/json
      responses:
        "201":
          description: Project created
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create Project
      tags:
