        type: string
      id:
        type: integer
      link:
        description: อนุญาตให้เป็น null
        type: string
      meeting_type:
        allOf:
        - $ref: '#/definitions/domain.MeetingType'
        description: '"online" หรือ "onsite"'
      milestone:
        $ref: '#/definitions/domain.Milestone'
      milestone_id:
        type: integer
      place:
        description: อนุญาตให้เป็น null
        type: string
      status:
        $ref: '#/definitions/domain.MeetingStatus'
      time:
        type: string
