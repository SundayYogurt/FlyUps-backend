basePath: /
definitions:
  domain.MediaType:
    enum:
    - image
    - video
    - raw
    type: string
    x-enum-varnames:
    - MediaTypeImage
    - MediaTypeVideo
    - MediaTypeRaw
  domain.MilestoneStatus:
    enum:
    - draft
    - waiting
    - active
    - submitted
    - approved
    - rejected
    - paid
    type: string
    x-enum-varnames:
    - MilestoneDraft
    - MilestoneWaiting
    - MilestoneActive
    - MilestoneSubmitted
    - MilestoneApproved
    - MilestoneRejected
    - MilestonePaid
  domain.ProjectVisibility:
    enum:
    - private
    - public
    - unlisted
    type: string
    x-enum-varnames:
    - VisibilityPrivate
    - VisibilityPublic
    - VisibilityUnlisted
  dto.BankRequest:
    properties:
      account_name:
        type: string
      account_number:
        type: string
      bank_name:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CreateDomainRequest:
    properties:
      domain:
        type: string
    type: object
  dto.CreateInvestmentRequest:
    properties:
      amount:
        type: number
      project_id:
        type: integer
    required:
    - amount
    - project_id
    type: object
  dto.CreateMilestoneRequest:
    properties:
      acceptance_criteria:
        type: string
      description:
        type: string
      duration:
        type: integer
      phase_no:
        type: integer
      sort_order:
        type: integer
      status:
        $ref: '#/definitions/domain.MilestoneStatus'
      title:
        type: string
      type:
        items:
          $ref: '#/definitions/domain.MediaType'
        type: array
      urls:
        items:
          type: string
        type: array
    type: object
  dto.CreateProjectUpdateRequest:
    properties:
      content:
        type: string
      milestone_id:
        type: integer
      title:
        type: string
      visibility:
        $ref: '#/definitions/domain.ProjectVisibility'
    type: object
  dto.CreateUniversityRequest:
    properties:
      name_en:
        type: string
      name_th:
        type: string
      province:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.InvestmentResponse:
    properties:
      expires_at:
        type: string
      investment_id:
        type: integer
      qr_code_image_url:
        type: string
      reference_number:
        type: string
      title:
        type: string
      total_amount:
        type: number
    type: object
  dto.ProfileInput:
    properties:
      address:
        type: string
      bio:
        type: string
      faculty:
        type: string
      first_name:
        description: '--- ข้อมูลส่วนตัว ---'
        type: string
      last_name:
        type: string
      major:
        type: string
      phone:
        type: string
      picture:
        type: string
      portfolio:
        type: string
      skills:
        type: string
      student_code:
        type: string
      university_id:
        description: |-
          --- Pioneer only ---
          UniversityID: จะถูก derive จาก domain ของ email ที่สมัคร (pioneer)
          ยังคงไว้เพื่อ backward compatibility แต่ server จะ ignore ค่า input นี้
        type: integer
    type: object
  dto.ProjectMediaItem:
    properties:
      type:
        example:
        - video
        items:
          $ref: '#/definitions/domain.MediaType'
        type: array
      url:
        example: https://res.cloudinary.com/dsvexmpb6/video/upload/v1774969166/flyup/projects/videos/demo.mp4
        type: string
    required:
    - type
    - url
    type: object
  dto.RefundResponse:
    properties:
      fees_deducted:
        type: number
      investment_id:
        type: integer
      reference_number:
        type: string
      refund_amount:
        type: number
      total_paid:
        type: number
    type: object
  dto.SuspendUserInput:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  dto.UpdateDomainRequest:
    properties:
      domain:
        type: string
      is_active:
        type: boolean
    type: object
  dto.UpdateMilestoneRequest:
    properties:
      acceptance_criteria:
        type: string
      description:
        type: string
      duration:
        type: integer
      phase_no:
        type: integer
      sort_order:
        type: integer
      status:
        $ref: '#/definitions/domain.MilestoneStatus'
      title:
        type: string
      type:
        items:
          $ref: '#/definitions/domain.MediaType'
        type: array
      urls:
        items:
          type: string
        type: array
    type: object
  dto.UpdateProjectRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      duration_days:
        type: integer
      duration_months:
        type: integer
      funding_goal:
        type: number
      max_invest_amount:
        type: number
      min_invest_amount:
        type: number
      platform_fee:
        type: number
      profit_share_pct:
        type: number
      risk:
        type: string
      softcap:
        type: number
      title:
        type: string
      visibility:
        type: string
    type: object
  dto.UpdateProjectUpdateRequest:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  dto.UserSignUp:
    properties:
      accept_terms:
        description: ยอมรับข้อตกลง
        type: boolean
      email:
        type: string
      first_name:
        description: ข้อมูลส่วนตัว
        type: string
      last_name:
        type: string
      password:
        description: รหัสผ่าน
        minLength: 8
        type: string
      phone:
        description: เบอร์โทรศัพท์ (ใน UI ไม่มีดอกจัน * แต่ใน DBML ระบุว่า not null
          ดังนั้นควรบังคับกรอก)
        type: string
      role:
        enum:
        - pioneer
        - booster
        type: string
    required:
    - accept_terms
    - email
    - first_name
    - last_name
    - password
    - phone
    - role
    type: object
  dto.UserSigning:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.VerifyIDInput:
    properties:
      declare_truth:
        type: boolean
      id_card_url:
        type: string
      selfie_url:
        type: string
    required:
    - id_card_url
    - selfie_url
    type: object
  dto.VerifyStudentInput:
    properties:
      accept_pioneer_terms:
        type: boolean
      declare_truth:
        type: boolean
      student_card_url:
        type: string
    required:
    - student_card_url
    type: object
host: api.flyupapi.dev
info:
  contact: {}
  description: FlyUps crowdfunding platform API
  title: FlyUps API
  version: "1.0"
paths:
  /SignUp:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: SignUp Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserSignUp'
      produces:
      - application/json
      responses:
        "201":
          description: Success message
          schema:
            type: object
        "400":
          description: Validation failed
          schema:
            type: object
        "409":
          description: User already registered
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Register a new user
      tags:
      - Users
  /admin/approve-id-card/{id}:
    patch:
      description: Admin approves an ID card verification
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
