host: api.flyupapi.dev
info:
  contact: {}
  description: FlyUps crowdfunding platform API
  title: FlyUps API
  version: "1.0"
paths:
  /SignUp:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: SignUp Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserSignUp'
      produces:
      - application/json
      responses:
        "201":
          description: Success message
          schema:
            type: object
        "400":
          description: Validation failed
          schema:
            type: object
        "409":
          description: User already registered
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Register a new user
      tags:
      - Users
  /admin/approve-id-card/{id}:
    patch:
      description: Admin approves an ID card verification
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: id card approved
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Approve ID card
      tags:
      - Admin
  /admin/approve-student-card/{id}:
    patch:
      description: Admin approves a student card verification
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: student card approved
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Approve student card
      tags:
      - Admin
  /admin/categories:
    post:
      consumes:
      - application/json
      description: Admin creates a new project category
      parameters:
      - description: Category Name
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Category created
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create Category
      tags:
      - Categories
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      description: Admin deletes a project category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Category deleted
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete Category
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Admin updates an existing project category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: New Category Name
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Category updated
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update Category
      tags:
      - Categories
  /admin/complaints:
    get:
      parameters:
      - description: open|resolved|rejected
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all complaints (admin only)
      tags:
      - Complaints
  /admin/complaints/{id}:
    get:
      parameters:
      - description: Complaint ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a single complaint (admin only)
      tags:
      - Complaints
  /admin/complaints/{id}/reject:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Complaint ID
        in: path
        name: id
        required: true
        type: integer
      - description: Rejection note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResolveComplaintRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reject a complaint (admin only)
      tags:
      - Complaints
  /admin/complaints/{id}/resolve:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Complaint ID
        in: path
        name: id
        required: true
        type: integer
      - description: Resolution note
        in: body
        name: body
